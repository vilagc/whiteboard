<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mr. Vilags Workspace</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- jsPDF CDN for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Desmos API CDN -->
  <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>

  <style>
    /* Prevent selection and default touch scroll behavior for drawing */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Grid background patterns */
    .bg-grid {
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(200, 210, 225, 0.5) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(200, 210, 225, 0.5) 1px, transparent 1px);
    }
    
    .bg-dots {
      background-size: 25px 25px;
      background-image: radial-gradient(circle, rgba(150, 160, 180, 0.4) 1.5px, transparent 1.5px);
    }

    .bg-blank {
      background-color: #ffffff;
    }

    /* Floating UI Window Shadows and Styles */
    .floating-window {
      box-shadow: 0 12px 28px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.22);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 3px;
    }

    /* Tooltip styles */
    [data-tooltip] {
      position: relative;
    }
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 115%;
      top: 50%;
      transform: translateY(-50%);
      background-color: #0f172a;
      color: #ffffff;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      z-index: 50;
      pointer-events: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Sound alert pulse effect */
    @keyframes alarmPulse {
      0% { background-color: rgba(239, 68, 68, 0.25); }
      50% { background-color: rgba(239, 68, 68, 0.85); }
      100% { background-color: rgba(239, 68, 68, 0.25); }
    }
    .alarm-active {
      animation: alarmPulse 0.8s infinite;
    }

    .tool-btn-active {
      background-color: #4f46e5 !important;
      color: #ffffff !important;
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.4);
    }
  </style>
</head>
<body class="bg-slate-950 h-screen w-screen flex flex-col relative overflow-hidden select-none">

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <header class="h-12 bg-slate-900 text-white flex items-center justify-between px-3 z-30 shadow-md border-b border-slate-800 shrink-0">
    <!-- Left Section: Title & Toggle Tools -->
    <div class="flex items-center space-x-3">
      <button id="toggle-sidebar-btn" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 px-2.5 py-1 rounded-md text-xs flex items-center space-x-1.5 transition border border-slate-700">
        <i class="fa-solid fa-bars"></i>
        <span id="toggle-sidebar-text" class="hidden sm:inline">Hide Tools</span>
      </button>
      
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-chalkboard-user text-indigo-400 text-lg"></i>
        <h1 class="font-bold text-sm md:text-base tracking-wide text-gray-100 truncate">Mr. Vilags Workspace</h1>
      </div>
    </div>

    <!-- Center Section: Clock -->
    <div class="flex items-center justify-center py-0.5 max-h-full">
      <div class="flex items-center space-x-2 px-2.5 py-0.5 rounded-md bg-slate-800/90 border border-slate-700/60 shadow-inner">
        <i class="fa-regular fa-clock text-amber-400 text-xs md:text-sm"></i>
        <div class="flex items-baseline space-x-1.5">
          <span id="live-clock" class="text-xs md:text-sm font-black font-mono tracking-tight text-amber-300 leading-tight">12:00:00 PM</span>
          <span id="live-date" class="text-[10px] font-medium text-slate-400 leading-tight hidden md:inline">Mon, Oct 24</span>
        </div>
      </div>
    </div>

    <!-- Right Section: Window Toggles & Actions -->
    <div class="flex items-center space-x-2">
      <!-- Zoom Controls Indicator -->
      <div class="flex items-center space-x-1 bg-slate-800 border border-slate-700 rounded-md px-1.5 py-0.5 text-xs text-slate-300">
        <button onclick="zoomOut()" class="hover:text-white px-1 py-0.5 rounded hover:bg-slate-700"><i class="fa-solid fa-minus"></i></button>
        <span id="zoom-level-text" class="font-mono text-[11px] w-10 text-center text-amber-300">100%</span>
        <button onclick="zoomIn()" class="hover:text-white px-1 py-0.5 rounded hover:bg-slate-700"><i class="fa-solid fa-plus"></i></button>
        <button onclick="resetView()" class="hover:text-white px-1 text-[10px] text-slate-400 border-l border-slate-700 ml-1 pl-1.5" title="Reset View & Position">
          <i class="fa-solid fa-arrows-to-dot"></i>
        </button>
      </div>

      <!-- Background Switcher Dropdown -->
      <div class="relative group">
        <button class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded-md text-xs flex items-center space-x-1 border border-slate-700">
          <i class="fa-solid fa-border-all text-indigo-400"></i>
          <span id="current-bg-name" class="hidden sm:inline">Blank</span>
          <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
        </button>
        <div class="absolute right-0 top-full pt-1 z-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
          <div class="w-36 bg-slate-900 border border-slate-700 rounded-lg shadow-xl overflow-hidden py-1">
            <button onclick="setCanvasBackground('blank')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-indigo-600 flex items-center space-x-2">
              <i class="fa-regular fa-square w-4"></i><span>Blank Canvas</span>
            </button>
            <button onclick="setCanvasBackground('grid')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-indigo-600 flex items-center space-x-2">
              <i class="fa-solid fa-table-cells w-4"></i><span>Grid Paper</span>
            </button>
            <button onclick="setCanvasBackground('dots')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-indigo-600 flex items-center space-x-2">
              <i class="fa-solid fa-ellipsis-vertical w-4"></i><span>Dot Grid</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Toggle Timer Widget Button -->
      <button id="toggle-timer-btn" class="bg-slate-800 hover:bg-slate-700 text-amber-300 px-2.5 py-1 rounded-md text-xs flex items-center space-x-1 border border-slate-700">
        <i class="fa-solid fa-stopwatch"></i>
        <span class="hidden sm:inline">Timer</span>
      </button>

      <!-- Toggle Calculator Button -->
      <button id="toggle-calc-btn" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 px-2.5 py-1 rounded-md text-xs flex items-center space-x-1 border border-slate-700">
        <i class="fa-solid fa-calculator"></i>
        <span class="hidden sm:inline">Calculator</span>
      </button>

      <!-- Toggle Wheel Picker Dropdown -->
      <div class="relative group">
        <button class="bg-slate-800 hover:bg-slate-700 text-pink-300 px-2.5 py-1 rounded-md text-xs flex items-center space-x-1 border border-slate-700">
          <i class="fa-solid fa-dharmachakra"></i>
          <span class="hidden sm:inline">Name Picker</span>
          <i class="fa-solid fa-chevron-down text-[10px] ml-0.5 text-pink-400"></i>
        </button>
        <div class="absolute right-0 top-full pt-1 z-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
          <div class="w-32 bg-slate-900 border border-slate-700 rounded-lg shadow-xl overflow-hidden py-1">
            <button onclick="openWheel('1')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-pink-600 flex items-center space-x-2">
              <i class="fa-regular fa-clock w-4 text-pink-300"></i><span>Hour 1</span>
            </button>
            <button onclick="openWheel('3')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-pink-600 flex items-center space-x-2">
              <i class="fa-regular fa-clock w-4 text-pink-300"></i><span>Hour 3</span>
            </button>
            <button onclick="openWheel('4')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-pink-600 flex items-center space-x-2">
              <i class="fa-regular fa-clock w-4 text-pink-300"></i><span>Hour 4</span>
            </button>
            <button onclick="openWheel('6')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-pink-600 flex items-center space-x-2">
              <i class="fa-regular fa-clock w-4 text-pink-300"></i><span>Hour 6</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Fullscreen Toggle -->
      <button id="fullscreen-btn" onclick="toggleFullscreen()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md text-xs flex items-center space-x-1 border border-slate-700 transition" title="Enter Fullscreen">
        <i class="fa-solid fa-expand"></i>
      </button>

      <!-- Export Options -->
      <div class="relative group">
        <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded-md text-xs flex items-center space-x-1 font-medium shadow">
          <i class="fa-solid fa-download"></i>
          <span class="hidden md:inline">Export</span>
          <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
        </button>
        <div class="absolute right-0 top-full pt-1 z-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
          <div class="w-36 bg-slate-900 border border-slate-700 rounded-lg shadow-xl overflow-hidden py-1">
            <button onclick="exportCanvas('png')" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-indigo-600 flex items-center space-x-2">
              <i class="fa-regular fa-file-image text-green-400 w-4"></i><span>Image (PNG)</span>
            </button>
            <button onclick="exportCanvas('pdf')" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-indigo-600 flex items-center space-x-2">
              <i class="fa-regular fa-file-pdf text-red-400 w-4"></i><span>PDF Document</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= TAB BAR FOR MULTIPLE WHITEBOARDS ================= -->
  <div class="h-9 bg-slate-950 text-slate-300 flex items-center px-2 z-20 border-b border-slate-800 shrink-0 overflow-x-auto select-none">
    <div id="tabs-container" class="flex items-center space-x-1 overflow-x-auto py-1">
      <!-- Tabs dynamically injected here -->
    </div>
    <button onclick="createNewBoard()" class="ml-2 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white px-2 py-1 rounded-md text-xs flex items-center space-x-1 transition border border-slate-700/60 shrink-0" title="Create New Whiteboard">
      <i class="fa-solid fa-plus text-[10px]"></i>
      <span class="text-[11px] font-medium">New Board</span>
    </button>
  </div>

  <!-- ================= MAIN WORKSPACE CANVAS AREA ================= -->
  <main class="flex-1 relative overflow-hidden bg-white w-full h-full" id="canvas-container">
    
    <!-- Whiteboard Drawing Canvas -->
    <canvas id="whiteboard" class="absolute inset-0 bg-blank z-0 cursor-crosshair block w-full h-full"></canvas>

    <!-- Visual Cursor Indicator for Eraser -->
    <div id="eraser-cursor" class="pointer-events-none absolute hidden rounded-full border border-slate-700 bg-red-400/20 z-10 -translate-x-1/2 -translate-y-1/2 shadow-sm"></div>

    <!-- SLIM SINGLE-COLUMN LEFT TOOLBAR -->
    <aside id="left-sidebar" class="absolute left-2 top-2 z-20 flex flex-col bg-slate-900/95 backdrop-blur-md text-white rounded-xl shadow-2xl border border-slate-700/80 p-1.5 space-y-1.5 transition-all duration-300 w-12 items-center max-h-[calc(100%-1rem)] overflow-y-auto">
      
      <!-- DRAWING TOOLS SECTION -->
      <div class="flex flex-col space-y-1 w-full items-center">
        <!-- Pan / Hand Tool -->
        <button id="tool-pan" onclick="setTool('pan')" class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition" data-tooltip="Pan Canvas (Space+Drag)">
          <i class="fa-solid fa-hand"></i>
        </button>

        <!-- Pen Tool -->
        <button id="tool-pen" onclick="setTool('pen')" class="w-9 h-9 rounded-lg flex items-center justify-center bg-indigo-600 text-white transition shadow" data-tooltip="Pen">
          <i class="fa-solid fa-pen"></i>
        </button>

        <!-- Highlighter Tool -->
        <button id="tool-highlighter" onclick="setTool('highlighter')" class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition" data-tooltip="Highlighter">
          <i class="fa-solid fa-highlighter"></i>
        </button>

        <!-- Text Tool -->
        <button id="tool-text" onclick="setTool('text')" class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition" data-tooltip="Text Note">
          <i class="fa-solid fa-font"></i>
        </button>

        <!-- Shapes Dropdown / Selection -->
        <div class="relative group w-full flex justify-center">
          <button id="tool-shape" onclick="setTool(activeShapeTool)" class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition" data-tooltip="Shapes">
            <i id="active-shape-icon" class="fa-solid fa-shapes"></i>
          </button>
          
          <!-- Shape Picker Menu -->
          <div class="absolute left-11 top-0 hidden group-hover:flex flex-col bg-slate-900 border border-slate-700 p-1 rounded-lg shadow-xl z-50 space-y-1">
            <button onclick="selectShapeTool('line')" class="w-8 h-8 rounded hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center" title="Line">
              <i class="fa-solid fa-slash"></i>
            </button>
            <button onclick="selectShapeTool('arrow')" class="w-8 h-8 rounded hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center" title="Arrow">
              <i class="fa-solid fa-arrow-right-long"></i>
            </button>
            <button onclick="selectShapeTool('rect')" class="w-8 h-8 rounded hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center" title="Rectangle">
              <i class="fa-regular fa-square"></i>
            </button>
            <button onclick="selectShapeTool('circle')" class="w-8 h-8 rounded hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center" title="Circle">
              <i class="fa-regular fa-circle"></i>
            </button>
            <button onclick="selectShapeTool('triangle')" class="w-8 h-8 rounded hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center" title="Triangle">
              <i class="fa-solid fa-play -rotate-90"></i>
            </button>
          </div>
        </div>

        <!-- Eraser Tool -->
        <button id="tool-eraser" onclick="setTool('eraser')" class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition" data-tooltip="Eraser">
          <i class="fa-solid fa-eraser"></i>
        </button>
      </div>

      <div class="w-full border-t border-slate-700/80 my-1"></div>

      <!-- COLORS PALETTE -->
      <div id="color-palette" class="flex flex-col space-y-1.5 w-full items-center">
        <!-- Black / Default Dark -->
        <button onclick="setColor('#1e293b')" class="color-btn w-6 h-6 rounded-full bg-slate-800 border-2 border-white shadow hover:scale-110 transition" data-color="#1e293b"></button>
        <!-- Blue -->
        <button onclick="setColor('#2563eb')" class="color-btn w-6 h-6 rounded-full bg-blue-600 border-2 border-transparent shadow hover:scale-110 transition" data-color="#2563eb"></button>
        <!-- Red -->
        <button onclick="setColor('#dc2626')" class="color-btn w-6 h-6 rounded-full bg-red-600 border-2 border-transparent shadow hover:scale-110 transition" data-color="#dc2626"></button>
        <!-- Green -->
        <button onclick="setColor('#16a34a')" class="color-btn w-6 h-6 rounded-full bg-green-600 border-2 border-transparent shadow hover:scale-110 transition" data-color="#16a34a"></button>
        
        <!-- Highlighter Quick Colors -->
        <div id="highlighter-colors" class="hidden flex-col space-y-1.5 pt-1">
          <button onclick="setColor('rgba(250, 204, 21, 0.25)')" class="color-btn w-6 h-6 rounded-full bg-yellow-400 border-2 border-transparent shadow hover:scale-110 transition" data-color="rgba(250, 204, 21, 0.25)"></button>
          <button onclick="setColor('rgba(74, 222, 128, 0.25)')" class="color-btn w-6 h-6 rounded-full bg-green-400 border-2 border-transparent shadow hover:scale-110 transition" data-color="rgba(74, 222, 128, 0.25)"></button>
          <button onclick="setColor('rgba(56, 189, 248, 0.25)')" class="color-btn w-6 h-6 rounded-full bg-cyan-400 border-2 border-transparent shadow hover:scale-110 transition" data-color="rgba(56, 189, 248, 0.25)"></button>
          <button onclick="setColor('rgba(244, 114, 182, 0.25)')" class="color-btn w-6 h-6 rounded-full bg-pink-400 border-2 border-transparent shadow hover:scale-110 transition" data-color="rgba(244, 114, 182, 0.25)"></button>
        </div>
      </div>

      <div class="w-full border-t border-slate-700/80 my-1"></div>

      <!-- TOOL SIZE CONTROLLER -->
      <div class="flex flex-col items-center space-y-1 w-full">
        <span class="text-[9px] font-mono text-slate-400 uppercase tracking-tighter">Size</span>
        <div class="relative group flex flex-col items-center">
          <input type="number" id="stroke-px-input" min="1" max="100" value="3" onchange="setToolSize(this.value)" class="w-9 bg-slate-800 border border-slate-700 text-white text-xs font-mono font-bold rounded py-0.5 text-center focus:outline-none focus:border-indigo-500">
          <span id="px-unit" class="text-[8px] text-slate-400 mt-0.5">px</span>

          <!-- Popup slider widget on hover/focus -->
          <div class="absolute left-11 top-1/2 -translate-y-1/2 hidden group-hover:flex group-focus-within:flex bg-slate-900 border border-slate-700 p-2 rounded-lg shadow-xl z-50 items-center w-28">
            <input type="range" id="stroke-px-slider" min="1" max="100" value="3" oninput="setToolSize(this.value)" class="w-full accent-indigo-500 cursor-pointer h-1.5 bg-slate-700 rounded-lg">
          </div>
        </div>
      </div>

      <div class="w-full border-t border-slate-700/80 my-1"></div>

      <!-- UNDO / REDO / CLEAR -->
      <div class="flex flex-col space-y-1 w-full items-center">
        <button onclick="undo()" class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-300 hover:bg-slate-800 hover:text-white transition" data-tooltip="Undo">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button onclick="redo()" class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-300 hover:bg-slate-800 hover:text-white transition" data-tooltip="Redo">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button onclick="clearCanvas()" class="w-9 h-9 rounded-lg flex items-center justify-center text-red-400 hover:bg-red-500 hover:text-white transition" data-tooltip="Clear Board">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>

    </aside>

    <!-- Floating Re-open Tools Button (When Sidebar Hidden) -->
    <button id="show-sidebar-tab" onclick="toggleSidebar()" class="hidden absolute left-0 top-6 z-20 bg-slate-900 text-white px-2 py-2.5 rounded-r-lg shadow-lg border border-l-0 border-slate-700 hover:bg-indigo-600 transition flex items-center space-x-1">
      <i class="fa-solid fa-screwdriver-wrench text-xs"></i>
      <span class="text-xs font-semibold pr-1">Tools</span>
    </button>

    <!-- ================= FLOATING COUNTDOWN TIMER WIDGET ================= -->
    <div id="timer-widget" class="floating-window absolute top-4 right-4 z-20 bg-slate-900/95 backdrop-blur-md text-white rounded-xl shadow-2xl border border-slate-700/80 w-72 hidden overflow-hidden transition-all">
      <!-- Title / Header Bar (Draggable) -->
      <div id="timer-header" class="bg-slate-800/90 px-3 py-2 flex items-center justify-between cursor-move border-b border-slate-700/60">
        <div class="flex items-center space-x-2 text-amber-400 font-semibold text-xs tracking-wider uppercase">
          <i class="fa-solid fa-stopwatch"></i>
          <span>Countdown Timer</span>
        </div>
        <div class="flex items-center space-x-1">
          <button onclick="testMarimbaSound()" class="text-slate-400 hover:text-amber-300 text-xs px-1.5 py-0.5 rounded hover:bg-slate-700 transition" title="Test Marimba Sound">
            <i class="fa-solid fa-volume-high"></i>
          </button>
          <button onclick="toggleTimerWidget()" class="text-slate-400 hover:text-white text-xs px-1.5 py-0.5 rounded hover:bg-slate-700 transition">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Main Display -->
      <div class="p-3.5 flex flex-col items-center">
        <!-- Big Digits Display -->
        <div id="timer-display" class="text-4xl font-black font-mono tracking-wider text-amber-400 my-1 drop-shadow">
          05:00
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden my-2 border border-slate-700">
          <div id="timer-progress" class="bg-amber-400 h-full w-full transition-all duration-300"></div>
        </div>

        <!-- Quick Preset Buttons -->
        <div class="grid grid-cols-5 gap-1 w-full my-2">
          <button onclick="setTimerPreset(0.5)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1 rounded font-medium border border-slate-700">30s</button>
          <button onclick="setTimerPreset(1)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1 rounded font-medium border border-slate-700">1m</button>
          <button onclick="setTimerPreset(2)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1 rounded font-medium border border-slate-700">2m</button>
          <button onclick="setTimerPreset(5)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1 rounded font-medium border border-slate-700">5m</button>

          <p class="text-xs text-red-100">Great job on your workspace task!</p>
        </div>

        Stop Sound
      </button>

  </main>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    /* ================= 1. INITIALIZATION & STATE ================= */
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    const canvasContainer = document.getElementById('canvas-container');
    const eraserCursor = document.getElementById('eraser-cursor');

    /* ================= ERROR HANDLING & DIAGNOSTICS ================= */
    function showDiagnosticToast(message, type = 'error') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-600' : 'bg-slate-800';
      const icon = type === 'error' ? '<i class="fa-solid fa-triangle-exclamation text-yellow-300"></i>' : '<i class="fa-solid fa-circle-info text-blue-400"></i>';
      toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-xl border border-white/20 flex items-center space-x-3 transition-all duration-300 opacity-0 translate-y-4 pointer-events-auto`;
      toast.innerHTML = `${icon}<span class="text-sm font-medium">${message}</span><button onclick="this.parentElement.remove()" class="ml-auto hover:text-gray-300 px-1"><i class="fa-solid fa-xmark"></i></button>`;
      container.appendChild(toast);
      
      requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-y-4'));
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4');
        setTimeout(() => toast.remove(), 300);
      }, 5000);
      
      if (type === 'error') {
        console.error("[Workspace Diagnostic Error]", message);
      } else {
        console.log("[Workspace Diagnostic Info]", message);
      }
    }

    // Monitor for canvas context loss (happens when browser limits WebGL/Canvas memory)
    canvas.addEventListener('contextlost', (e) => {
      e.preventDefault();
      showDiagnosticToast("Canvas memory limit reached! The browser stopped drawing to save memory. Try clearing or exporting boards.", "error");
    });

    let isDrawing = false;
    let isPanning = false;
    let spacePressed = false;
    let panStartX = 0, panStartY = 0;

    let currentTool = 'pen'; // 'pen', 'highlighter', 'text', 'line', 'arrow', 'rect', 'circle', 'triangle', 'eraser', 'pan'
    let activeShapeTool = 'line';
    let strokeColor = '#1e293b';
    let highlighterColor = 'rgba(250, 204, 21, 0.25)';
    let currentStroke = null;
    let activeTextElement = null;

    // Touch gesture pinch/zoom tracking
    let initialPinchDistance = null;
    let initialZoom = 1;

    // Tool sizes saved in pixels
    const toolSizes = {
      pen: 3,
      highlighter: 18,
      text: 20,
      line: 3,
      arrow: 3,
      rect: 3,
      circle: 3,
      triangle: 3,
      eraser: 24
    };

    // MULTIPLE BOARDS TAB MANAGEMENT
    let boards = [];
    let activeBoardId = null;
    let boardIdCounter = 1;

    // Active board state references
    let cameraOffset = { x: 0, y: 0 };
    let cameraZoom = 1;
    let currentBackground = 'blank';
    let drawings = [];
    let historyStack = [];
    let historyStep = -1;

    const MIN_ZOOM = 0.25;
    const MAX_ZOOM = 5.0;
    const MAX_HISTORY = 35;

    /* ================= MULTIPLE BOARDS ENGINE ================= */
    function createNewBoard(title = null) {
      saveActiveBoardState();

      const newId = 'board_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      const newBoard = {
        id: newId,
        title: title || `Board ${boardIdCounter++}`,
        drawings: [],
        cameraOffset: { x: 0, y: 0 },
        cameraZoom: 1,
        background: 'blank',
        historyStack: [],
        historyStep: -1
      };

      boards.push(newBoard);
      switchBoard(newId);
    }

    function switchBoard(id) {
      if (activeBoardId === id) return;

      saveActiveBoardState();

      activeBoardId = id;
      const board = boards.find(b => b.id === id);
      if (!board) return;

      drawings = board.drawings;
      cameraOffset = { ...board.cameraOffset };
      cameraZoom = board.cameraZoom;
      currentBackground = board.background;
      historyStack = board.historyStack;
      historyStep = board.historyStep;

      setCanvasBackground(currentBackground);
      renderTabs();
      redrawCanvas();
    }

    function saveActiveBoardState() {
      if (!activeBoardId) return;
      const board = boards.find(b => b.id === activeBoardId);
      if (board) {
        board.drawings = drawings;
        board.cameraOffset = { ...cameraOffset };
        board.cameraZoom = cameraZoom;
        board.background = currentBackground;
        board.historyStack = historyStack;
        board.historyStep = historyStep;
      }
    }

    function closeBoard(id, event) {
      if (event) event.stopPropagation();

      if (boards.length <= 1) {
        drawings = [];
        historyStack = [];
        historyStep = -1;
        saveState();
        redrawCanvas();
        return;
      }

      const index = boards.findIndex(b => b.id === id);
      boards = boards.filter(b => b.id !== id);

      if (activeBoardId === id) {
        const nextBoard = boards[Math.max(0, index - 1)];
        activeBoardId = null;
        switchBoard(nextBoard.id);
      } else {
        renderTabs();
      }
    }

    function renameBoard(id, event) {
      if (event) event.stopPropagation();
      const board = boards.find(b => b.id === id);
      if (!board) return;

      const newTitle = prompt('Rename Whiteboard Tab:', board.title);
      if (newTitle && newTitle.trim() !== '') {
        board.title = newTitle.trim();
        renderTabs();
      }
    }

    function renderTabs() {
      const container = document.getElementById('tabs-container');
      if (!container) return;

      container.innerHTML = '';
      boards.forEach(board => {
        const isActive = board.id === activeBoardId;
        const tabEl = document.createElement('div');
        tabEl.className = `flex items-center space-x-1.5 px-3 py-1 rounded-t-md text-xs cursor-pointer transition border-t border-x ${
          isActive
            ? 'bg-slate-900 text-white border-slate-700 font-semibold shadow-inner'
            : 'bg-slate-900/40 text-slate-400 hover:bg-slate-800 hover:text-slate-200 border-transparent'
        }`;

        tabEl.onclick = () => switchBoard(board.id);

        tabEl.innerHTML = `
          <i class="fa-solid fa-pen-ruler text-[10px] ${isActive ? 'text-indigo-400' : 'text-slate-500'}"></i>
          <span class="max-w-[110px] truncate" title="${board.title}">${board.title}</span>
          <button onclick="renameBoard('${board.id}', event)" class="hover:text-amber-300 text-[10px] opacity-60 hover:opacity-100 px-0.5" title="Rename Board">
            <i class="fa-solid fa-pen"></i>
          </button>
          <button onclick="closeBoard('${board.id}', event)" class="hover:text-red-400 text-[10px] opacity-60 hover:opacity-100 px-0.5" title="Close Board">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;

        container.appendChild(tabEl);
      });
    }

    /* ================= 2. CANVAS RESIZING & RENDERING ================= */
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvasContainer.getBoundingClientRect();

      if (rect.width === 0 || rect.height === 0) return;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;

      redrawCanvas();
    }

    function redrawCanvas() {
      try {
        const dpr = window.devicePixelRatio || 1;
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.restore();

        ctx.save();
        ctx.scale(dpr, dpr);
        drawPatternBackground();
        
        ctx.translate(cameraOffset.x, cameraOffset.y);
        ctx.scale(cameraZoom, cameraZoom);

        drawings.forEach(stroke => renderStroke(stroke));

        if (currentStroke) {
          renderStroke(currentStroke);
        }

        ctx.restore();
        
        const zoomText = document.getElementById('zoom-level-text');
        if (zoomText) zoomText.innerText = `${Math.round(cameraZoom * 100)}%`;
      } catch (err) {
        showDiagnosticToast(`Drawing Error: ${err.message}`, "error");
      }
    }

    function drawPatternBackground() {
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      if (currentBackground === 'blank') return;

      ctx.save();
      if (currentBackground === 'grid') {
        const gridSize = 30 * cameraZoom;
        const offsetX = (cameraOffset.x % gridSize + gridSize) % gridSize;
        const offsetY = (cameraOffset.y % gridSize + gridSize) % gridSize;

        ctx.strokeStyle = 'rgba(200, 210, 225, 0.5)';
        ctx.lineWidth = 1;

        for (let x = offsetX; x < width; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }

        for (let y = offsetY; y < height; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      } else if (currentBackground === 'dots') {
        const dotSize = 25 * cameraZoom;
        const offsetX = (cameraOffset.x % dotSize + dotSize) % dotSize;
        const offsetY = (cameraOffset.y % dotSize + dotSize) % dotSize;

        ctx.fillStyle = 'rgba(150, 160, 180, 0.4)';

        for (let x = offsetX; x < width; x += dotSize) {
          for (let y = offsetY; y < height; y += dotSize) {
            ctx.beginPath();
            ctx.arc(x, y, 1.5 * Math.min(cameraZoom, 1.5), 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      ctx.restore();
    }

    function renderStroke(stroke) {
      if (!stroke.points || stroke.points.length === 0) return;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (stroke.tool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = stroke.size;
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      } else if (stroke.tool === 'highlighter') {
        ctx.globalCompositeOperation = 'multiply';
        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.size;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.size;
      }

      const p1 = stroke.points[0];
      const p2 = stroke.points[stroke.points.length - 1];

      // Handle Shapes vs Freehand Pen
      if (['line', 'arrow', 'rect', 'circle', 'triangle'].includes(stroke.tool)) {
        ctx.beginPath();
        if (stroke.tool === 'line') {
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        } else if (stroke.tool === 'arrow') {
          drawArrow(ctx, p1.x, p1.y, p2.x, p2.y, stroke.size);
        } else if (stroke.tool === 'rect') {
          ctx.strokeRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
        } else if (stroke.tool === 'circle') {
          const radius = Math.hypot(p2.x - p1.x, p2.y - p1.y);
          ctx.arc(p1.x, p1.y, radius, 0, Math.PI * 2);
          ctx.stroke();
        } else if (stroke.tool === 'triangle') {
          ctx.moveTo(p1.x + (p2.x - p1.x) / 2, p1.y);
          ctx.lineTo(p1.x, p2.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.closePath();
          ctx.stroke();
        }
      } else if (stroke.tool === 'text') {
        ctx.font = `${stroke.size}px sans-serif`;
        ctx.fillStyle = stroke.color;
        ctx.textBaseline = 'top';
        ctx.fillText(stroke.text || '', p1.x, p1.y);
      } else {
        // Pen / Eraser / Highlighter Freehand
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        for (let i = 1; i < stroke.points.length; i++) {
          ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawArrow(ctx, fromx, fromy, tox, toy, size) {
      const headlen = Math.max(12, size * 3);
      const dx = tox - fromx;
      const dy = toy - fromy;
      const angle = Math.atan2(dy, dx);
      ctx.moveTo(fromx, fromy);
      ctx.lineTo(tox, toy);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(tox, toy);
      ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
      ctx.lineTo(tox, toy);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fill();
    }

    function setCanvasBackground(bgType) {
      currentBackground = bgType;
      const bgNameEl = document.getElementById('current-bg-name');
      if (bgType === 'grid' && bgNameEl) bgNameEl.innerText = 'Grid';
      else if (bgType === 'dots' && bgNameEl) bgNameEl.innerText = 'Dots';
      else if (bgNameEl) bgNameEl.innerText = 'Blank';
      
      redrawCanvas();
    }

    /* ================= 3. INFINITE CANVAS PAN & ZOOM LOGIC ================= */
    function screenToWorld(screenX, screenY) {
      return {
        x: (screenX - cameraOffset.x) / cameraZoom,
        y: (screenY - cameraOffset.y) / cameraZoom
      };
    }

    function getScreenCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      let x, y;
      if (e.touches && e.touches.length > 0) {
        x = e.touches[0].clientX - rect.left;
        y = e.touches[0].clientY - rect.top;
      } else {
        x = e.clientX - rect.left;
        y = e.clientY - rect.top;
      }
      return { x, y };
    }

    function zoomIn() {
      applyZoom(1.2, { x: canvas.width / 2, y: canvas.height / 2 });
    }

    function zoomOut() {
      applyZoom(0.8, { x: canvas.width / 2, y: canvas.height / 2 });
    }

    function resetView() {
      cameraOffset = { x: 0, y: 0 };
      cameraZoom = 1;
      redrawCanvas();
    }

    function applyZoom(zoomFactor, centerScreenPos) {
      const newZoom = Math.min(Math.max(cameraZoom * zoomFactor, MIN_ZOOM), MAX_ZOOM);
      
      const worldPos = screenToWorld(centerScreenPos.x, centerScreenPos.y);
      cameraOffset.x = centerScreenPos.x - worldPos.x * newZoom;
      cameraOffset.y = centerScreenPos.y - worldPos.y * newZoom;
      cameraZoom = newZoom;

      redrawCanvas();
    }

    // Mouse Wheel Zoom
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const screenPos = getScreenCoordinates(e);
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      applyZoom(zoomFactor, screenPos);
    }, { passive: false });

    // Keyboard Spacebar Panning
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !spacePressed) {
        spacePressed = true;
        canvas.style.cursor = 'grab';
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        spacePressed = false;
        canvas.style.cursor = currentTool === 'pan' ? 'grab' : 'crosshair';
      }
    });

    /* ================= 4. WHITEBOARD DRAWING ENGINE ================= */
    function startDrawing(e) {
      initAudioUnlock();

      if (currentTool === 'text') {
        const screenPos = getScreenCoordinates(e);
        const worldPos = screenToWorld(screenPos.x, screenPos.y);
        spawnTextInput(worldPos, screenPos);
        return;
      }

      const screenPos = getScreenCoordinates(e);

      if (currentTool === 'pan' || spacePressed || e.button === 1) {
        isPanning = true;
        panStartX = screenPos.x - cameraOffset.x;
        panStartY = screenPos.y - cameraOffset.y;
        canvas.style.cursor = 'grabbing';
        return;
      }

      isDrawing = true;
      const worldPos = screenToWorld(screenPos.x, screenPos.y);

      currentStroke = {
        tool: currentTool,
        color: currentTool === 'highlighter' ? highlighterColor : strokeColor,
        size: toolSizes[currentTool] || 3,
        points: [worldPos]
      };
    }

    function draw(e) {
      const screenPos = getScreenCoordinates(e);
      updateEraserCursorPosition(screenPos);

      if (isPanning) {
        cameraOffset.x = screenPos.x - panStartX;
        cameraOffset.y = screenPos.y - panStartY;
        redrawCanvas();
        return;
      }

      if (!isDrawing || !currentStroke) return;
      e.preventDefault();

      const worldPos = screenToWorld(screenPos.x, screenPos.y);

      if (['line', 'arrow', 'rect', 'circle', 'triangle'].includes(currentTool)) {
        currentStroke.points = [currentStroke.points[0], worldPos];
      } else {
        currentStroke.points.push(worldPos);
      }
      
      redrawCanvas();
    }

    function stopDrawing() {
      if (isPanning) {
        isPanning = false;
        canvas.style.cursor = spacePressed || currentTool === 'pan' ? 'grab' : 'crosshair';
      }

      if (isDrawing && currentStroke) {
        isDrawing = false;
        drawings.push(currentStroke);
        currentStroke = null;
        saveState();
        redrawCanvas();
      }
    }

    function spawnTextInput(worldPos, screenPos) {
      const userText = prompt("Enter text for whiteboard note:");
      if (userText && userText.trim() !== '') {
        drawings.push({
          tool: 'text',
          color: strokeColor,
          size: toolSizes.text || 20,
          text: userText.trim(),
          points: [worldPos]
        });
        saveState();
        redrawCanvas();
      }
    }

    function updateEraserCursorPosition(screenPos) {
      if (!eraserCursor) return;
      if (currentTool === 'eraser' && !isPanning) {
        const size = toolSizes.eraser * cameraZoom;
        eraserCursor.style.width = `${size}px`;
        eraserCursor.style.height = `${size}px`;
        eraserCursor.style.left = `${screenPos.x}px`;
        eraserCursor.style.top = `${screenPos.y}px`;
        eraserCursor.classList.remove('hidden');
      } else {
        eraserCursor.classList.add('hidden');
      }
    }

    function hideEraserCursor() {
      if (eraserCursor) eraserCursor.classList.add('hidden');
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', (e) => {
      stopDrawing();
      hideEraserCursor();
    });

    // Touch Event Handling with Pinch Zoom support
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startDrawing(e);
        updateEraserCursorPosition(getScreenCoordinates(e));
      } else if (e.touches.length === 2) {
        isDrawing = false;
        currentStroke = null;
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialZoom = cameraZoom;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        draw(e);
      } else if (e.touches.length === 2 && initialPinchDistance) {
        e.preventDefault();
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDist / initialPinchDistance;
        const rect = canvas.getBoundingClientRect();
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        
        applyZoom(factor * (initialZoom / cameraZoom), { x: midX, y: midY });
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
      stopDrawing();
      hideEraserCursor();
    });

    /* ================= 6. HISTORY (UNDO / REDO / CLEAR) ================= */
    function saveState() {
      if (historyStep < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyStep + 1);
      }
      historyStack.push(JSON.stringify(drawings));
      if (historyStack.length > MAX_HISTORY) {
        historyStack.shift();
      } else {
        historyStep++;
      }
    }

    function undo() {
      if (historyStep > 0) {
        historyStep--;
        drawings = JSON.parse(historyStack[historyStep]);
        redrawCanvas();
      } else if (historyStep === 0) {
        historyStep = -1;
        drawings = [];
        redrawCanvas();
      }
    }

    function redo() {
      if (historyStep < historyStack.length - 1) {
        historyStep++;
        drawings = JSON.parse(historyStack[historyStep]);
        redrawCanvas();
      }
    }

    function clearCanvas() {
      drawings = [];

    let timerDuration = 300;

    function initAudioUnlock() {

      display.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      if (progress && timerDuration > 0) {
        const percent = (timerRemaining / timerDuration) * 100;
        progress.style.width = `${percent}%`;

    function toggleTimer() {

      if (startBtnText) startBtnText.innerText = 'Pause';

      timerInterval = setInterval(() => {
        if (timerRemaining > 0) {

    function playMarimbaTone(freq, timeOffset = 0) {
      initAudioUnlock();
      if (!audioCtx) return;

      const now = audioCtx.currentTime + timeOffset;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 1.2);
    }

    function testMarimbaSound() {
      const notes = [261.63, 329.63, 392.00, 523.25];

    const classRosters = {
      "1": ["Saleh A", "Eman A", "Jenan A", "Majid E", "Hailey G", "Maghed G", "Kristopher G", "Mustafa H", "Yaseen H", "Jovanii K", "Cristian M", "Al Anood M", "Alayah M", "Janat M", "Nawal M", "Adrian M", "Yarah M", "Hamza N", "Senan Q", "Ismail Q", "Janeily R", "Eman S", "Khaled S", "Shyanne S", "Mutazz Y"],

    };
    
    const wheelColors = ['#fce181', '#9fdfb6', '#79c2ef', '#c49cce']; // Pastel yellow, green, blue, purple
    let currentWheelAngle = 0;
    let isSpinning = false;
    let wheelAnimFrame;
    let activeWheelHour = "1";

    function openWheel(hour) {
      activeWheelHour = hour;
      document.getElementById('wheel-hour-label').innerText = `- Hour ${hour}`;
      const popout = document.getElementById('wheel-popout');
      popout.classList.remove('hidden');
      popout.classList.add('flex');

    function closeWheelPopout() {
      const popout = document.getElementById('wheel-popout');

    function updateWheel() {
      const names = classRosters[activeWheelHour];
      if (!names) return;
      
      const canvas = document.getElementById('wheel-canvas');
      const wCtx = canvas.getContext('2d');
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = cx;
      const arc = (2 * Math.PI) / names.length;

      // Smart Color Assignment (No adjacent slices with the same color)
      const sliceColors = [];
      for (let i = 0; i < names.length; i++) {
        let avail = wheelColors.filter(c => {
          if (i > 0 && c === sliceColors[i - 1]) return false; // Not same as previous
          if (i === names.length - 1 && names.length > 1 && c === sliceColors[0]) return false; // Not same as first
          return true;
        });
        if (avail.length === 0) avail = wheelColors;
        sliceColors.push(avail[i % avail.length]);
      }
      
      wCtx.clearRect(0, 0, canvas.width, canvas.height);
      wCtx.save();
      
      wCtx.translate(cx, cy);
      wCtx.rotate(currentWheelAngle);
      wCtx.translate(-cx, -cy);

      for (let i = 0; i < names.length; i++) {
        const angle = i * arc;
        wCtx.beginPath();
        wCtx.fillStyle = sliceColors[i];
        wCtx.moveTo(cx, cy);
        wCtx.arc(cx, cy, radius, angle, angle + arc, false);
        wCtx.lineTo(cx, cy);
        wCtx.fill();
        
        // Draw slice borders for clean aesthetic
        wCtx.lineWidth = 2;
        wCtx.strokeStyle = 'rgba(0,0,0,0.05)';
        wCtx.stroke();

        // Draw text
        wCtx.save();
        wCtx.translate(cx, cy);
        wCtx.rotate(angle + arc / 2);
        wCtx.textAlign = 'right';
        wCtx.textBaseline = 'middle';
        wCtx.fillStyle = '#1e293b';
        wCtx.font = '28px "Segoe UI", Roboto, sans-serif';
        wCtx.fillText(names[i], radius - 25, 0);
        wCtx.restore();
      }
      
      // Draw center white circle to match reference
      wCtx.beginPath();
      wCtx.fillStyle = '#ffffff';
      wCtx.arc(cx, cy, 60, 0, 2 * Math.PI);
      wCtx.fill();
      
      wCtx.restore();
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      
      document.getElementById('winner-banner').classList.add('hidden');

      // Shortened spin time (1.5s to 2.5s)
      const spinTimeTotal = Math.random() * 1000 + 1500;
      let spinTime = 0;
      const spinVelocityTarget = Math.random() * 0.15 + 0.35;
      let currentVelocity = spinVelocityTarget;

      let lastTime = performance.now();

      function animateSpin(currentTime) {
        const dt = currentTime - lastTime;
        lastTime = currentTime;
        spinTime += dt;

        if (spinTime >= spinTimeTotal) {
          isSpinning = false;
          determineWinner();
          return;
        }

        const progress = spinTime / spinTimeTotal;
        const easeOut = 1 - Math.pow(progress, 3); // Cubic ease-out
        currentVelocity = spinVelocityTarget * easeOut;
        
        currentWheelAngle += currentVelocity;
        currentWheelAngle %= 2 * Math.PI;

        updateWheel();
        wheelAnimFrame = requestAnimationFrame(animateSpin);
      }
      wheelAnimFrame = requestAnimationFrame(animateSpin);
    }

    function determineWinner() {
      const names = classRosters[activeWheelHour];
      const arc = (2 * Math.PI) / names.length;
      
      let normAngle = currentWheelAngle % (2 * Math.PI);
      if (normAngle < 0) normAngle += 2 * Math.PI;

      let winningIndex = Math.floor(((2 * Math.PI - normAngle) % (2 * Math.PI)) / arc);
      if (winningIndex < 0) winningIndex += names.length;

      const winner = names[winningIndex];
      
      document.getElementById('winner-name').innerText = winner;
      document.getElementById('winner-banner').classList.remove('hidden');
      
      initAudioUnlock();
      if (audioCtx) {
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          playMarimbaTone(freq, idx * 0.1);
        });
      }
    }

    /* ================= 9.75 FULLSCREEN ENGINE ================= */
    function toggleFullscreen() {
      try {
        const docEl = document.documentElement;
        const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
        const exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (requestFS) {
            const fullScreenPromise = requestFS.call(docEl);
            if (fullScreenPromise !== undefined) {
              fullScreenPromise.catch(err => {
                const errMsg = (err && err.message ? err.message : "").toLowerCase();
                if (errMsg.includes("permissions") || errMsg.includes("disallowed") || (err && err.name === "NotAllowedError")) {
                  showDiagnosticToast("Fullscreen blocked by preview environment. Press F11 (Win) or ^⌘F (Mac) to hide the URL bar.", "info");
                } else {
                  showDiagnosticToast(`Error attempting to enable fullscreen: ${err ? err.message : 'Unknown'}`, "error");
                }
              });
            }
          } else {
            showDiagnosticToast("Fullscreen API is not supported in this browser.", "info");
          }
        } else {
          if (exitFS) {
            exitFS.call(document);
          }
        }
      } catch (err) {
        showDiagnosticToast(`Fullscreen error: ${err.message}`, "error");
      }
    }

    /* ================= 10. DRAGGABLE WINDOW ENGINE ================= */
    function makeDraggable(windowEl, headerEl) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

      headerEl.onmousedown = dragMouseDown;
      headerEl.ontouchstart = dragTouchStart;

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
        // Temporarily disable CSS transitions so it follows the mouse instantly
        windowEl.style.transition = 'none';
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        windowEl.style.top = (windowEl.offsetTop - pos2) + "px";
        windowEl.style.left = (windowEl.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
        // Restore CSS transitions for minimize/maximize animations
        windowEl.style.transition = '';
      }

      function dragTouchStart(e) {
        if (e.touches.length === 1) {
          pos3 = e.touches[0].clientX;
          pos4 = e.touches[0].clientY;
          document.ontouchend = closeTouchDrag;
          document.ontouchmove = touchDrag;
          // Temporarily disable CSS transitions so it follows the finger instantly
          windowEl.style.transition = 'none';
        }
      }

      function touchDrag(e) {
        if (e.touches.length === 1) {
          pos1 = pos3 - e.touches[0].clientX;
          pos2 = pos4 - e.touches[0].clientY;
          pos3 = e.touches[0].clientX;
          pos4 = e.touches[0].clientY;
          windowEl.style.top = (windowEl.offsetTop - pos2) + "px";
          windowEl.style.left = (windowEl.offsetLeft - pos1) + "px";
        }
      }

      function closeTouchDrag() {
        document.ontouchend = null;
        document.ontouchmove = null;
        // Restore CSS transitions for minimize/maximize animations
        windowEl.style.transition = '';
      }
    }

    makeDraggable(document.getElementById('timer-widget'), document.getElementById('timer-header'));
    makeDraggable(document.getElementById('calc-popout'), document.getElementById('calc-header'));
    makeDraggable(document.getElementById('wheel-popout'), document.getElementById('wheel-header'));

    /* ================= 11. EXPORT TO PNG & PDF ================= */
    function getExportCanvas() {
      const exportCanvas = document.createElement('canvas');
      
      let minX = 0, minY = 0, maxX = canvas.width, maxY = canvas.height;

      if (drawings.length > 0) {
        let allPoints = drawings.flatMap(d => d.points);
        minX = Math.min(...allPoints.map(p => p.x)) - 60;
        minY = Math.min(...allPoints.map(p => p.y)) - 60;
        maxX = Math.max(...allPoints.map(p => p.x)) + 60;
        maxY = Math.max(...allPoints.map(p => p.y)) + 60;
      }

      const exportWidth = Math.max(maxX - minX, 800);
      const exportHeight = Math.max(maxY - minY, 600);

      exportCanvas.width = exportWidth;
      exportCanvas.height = exportHeight;
      const expCtx = exportCanvas.getContext('2d');

      expCtx.fillStyle = '#ffffff';
      expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      expCtx.save();
      expCtx.translate(-minX, -minY);
      
      drawings.forEach(stroke => {
        if (!stroke.points || stroke.points.length === 0) return;
        renderStrokeOnContext(expCtx, stroke);
      });

      expCtx.restore();
      return exportCanvas;
    }

    function renderStrokeOnContext(targetCtx, stroke) {
      targetCtx.save();
      targetCtx.lineCap = 'round';
      targetCtx.lineJoin = 'round';

      if (stroke.tool === 'highlighter') {
        targetCtx.globalCompositeOperation = 'multiply';
        targetCtx.strokeStyle = stroke.color;
        targetCtx.lineWidth = stroke.size;
      } else if (stroke.tool !== 'eraser') {
        targetCtx.globalCompositeOperation = 'source-over';
        targetCtx.strokeStyle = stroke.color;
        targetCtx.lineWidth = stroke.size;
      }

      if (stroke.tool !== 'eraser') {
        const p1 = stroke.points[0];
        const p2 = stroke.points[stroke.points.length - 1];

        if (['line', 'arrow', 'rect', 'circle', 'triangle'].includes(stroke.tool)) {
          targetCtx.beginPath();
          if (stroke.tool === 'line') {
            targetCtx.moveTo(p1.x, p1.y);
            targetCtx.lineTo(p2.x, p2.y);
            targetCtx.stroke();
          } else if (stroke.tool === 'arrow') {
            drawArrow(targetCtx, p1.x, p1.y, p2.x, p2.y, stroke.size);
          } else if (stroke.tool === 'rect') {
            targetCtx.strokeRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
          } else if (stroke.tool === 'circle') {
            const radius = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            targetCtx.arc(p1.x, p1.y, radius, 0, Math.PI * 2);
            targetCtx.stroke();
          } else if (stroke.tool === 'triangle') {
            targetCtx.moveTo(p1.x + (p2.x - p1.x) / 2, p1.y);
            targetCtx.lineTo(p1.x, p2.y);
            targetCtx.lineTo(p2.x, p2.y);
            targetCtx.closePath();
            targetCtx.stroke();
          }
        } else if (stroke.tool === 'text') {
          targetCtx.font = `${stroke.size}px sans-serif`;
          targetCtx.fillStyle = stroke.color;
          targetCtx.textBaseline = 'top';
          targetCtx.fillText(stroke.text || '', p1.x, p1.y);
        } else {
          targetCtx.beginPath();
          targetCtx.moveTo(p1.x, p1.y);
          for (let i = 1; i < stroke.points.length; i++) {
            targetCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
          }
          targetCtx.stroke();
        }
      }
      targetCtx.restore();
    }

    function getDateFilenameString() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `Mr_Vilags_Workspace_${yyyy}-${mm}-${dd}`;
    }

    function exportCanvas(type) {
      const expCanvas = getExportCanvas();
      const filename = getDateFilenameString();

      if (type === 'png') {
        const link = document.createElement('a');
        link.download = `${filename}.png`;
        link.href = expCanvas.toDataURL('image/png');
        link.click();
      } else if (type === 'pdf') {
        const { jsPDF } = window.jspdf;
        const orientation = expCanvas.width > expCanvas.height ? 'landscape' : 'portrait';
        const pdf = new jsPDF(orientation, 'px', [expCanvas.width, expCanvas.height]);
        const imgData = expCanvas.toDataURL('image/png');
        pdf.addImage(imgData, 'PNG', 0, 0, expCanvas.width, expCanvas.height);
        pdf.save(`${filename}.pdf`);
      }
    }

    /* ================= 12. INITIALIZATION ON LOAD ================= */
    window.addEventListener('load', () => {
      createNewBoard('Whiteboard 1');
      setTimeout(resizeCanvas, 50);
      setTool('pen');
      setColor('#1e293b');
      updateSizeControlsUI();
      updateTimerDisplay();
      
      document.getElementById('toggle-sidebar-btn').addEventListener('click', toggleSidebar);
    });

    window.addEventListener('resize', resizeCanvas);
  </script>
