<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mr. Vilags Workspace</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- jsPDF CDN for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Desmos API CDN -->
  <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>

  <style>
    /* Prevent selection and default touch scroll behavior for drawing */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Grid background patterns */
    .bg-grid {
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(200, 210, 225, 0.5) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(200, 210, 225, 0.5) 1px, transparent 1px);
    }
    
    .bg-dots {
      background-size: 25px 25px;
      background-image: radial-gradient(circle, rgba(150, 160, 180, 0.4) 1.5px, transparent 1.5px);
    }

    .bg-blank {
      background-color: #ffffff;
    }

    /* Floating UI Window Shadows and Styles */
    .floating-window {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 3px;
    }

    /* Tooltip styles */
    [data-tooltip] {
      position: relative;
    }
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 110%;
      top: 50%;
      transform: translateY(-50%);
      background-color: #1f2937;
      color: #ffffff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
      z-index: 50;
      pointer-events: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Sound alert pulse effect */
    @keyframes alarmPulse {
      0% { background-color: rgba(239, 68, 68, 0.2); }
      50% { background-color: rgba(239, 68, 68, 0.8); }
      100% { background-color: rgba(239, 68, 68, 0.2); }
    }
    .alarm-active {
      animation: alarmPulse 0.8s infinite;
    }
  </style>
</head>
<body class="bg-gray-100 h-screen w-screen flex flex-col relative overflow-hidden">

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <header class="h-12 bg-slate-900 text-white flex items-center justify-between px-3 z-30 shadow-md border-b border-slate-800 shrink-0">
    <!-- Left Section: Title & Toggle Tools -->
    <div class="flex items-center space-x-3">
      <button id="toggle-sidebar-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded text-xs flex items-center space-x-1.5 transition border border-slate-700">
        <i class="fa-solid fa-bars"></i>
        <span id="toggle-sidebar-text">Hide Tools</span>
      </button>
      
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-chalkboard-user text-indigo-400 text-lg"></i>
        <h1 class="font-bold text-base tracking-wide text-gray-100">Mr. Vilags Workspace</h1>
      </div>
    </div>

    <!-- Center Section: Clock (Fit in bar, 50% larger time display) -->
    <div class="flex items-center justify-center py-0.5 max-h-full">
      <div class="flex items-center space-x-2 px-2.5 py-0.5 rounded-md bg-slate-800/80 border border-slate-700/60 shadow-inner">
        <i class="fa-regular fa-clock text-amber-400 text-sm"></i>
        <div class="flex items-baseline space-x-1.5">
          <span id="live-clock" class="text-base font-black font-mono tracking-tight text-amber-300 leading-tight">12:00:00 PM</span>
          <span id="live-date" class="text-[10px] font-medium text-slate-300 leading-tight">Mon, Oct 24</span>
        </div>
      </div>
    </div>

    <!-- Right Section: Window Toggles & Actions -->
    <div class="flex items-center space-x-2">
      <!-- Background Switcher Dropdown -->
      <div class="relative group">
        <button class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded text-xs flex items-center space-x-1 border border-slate-700">
          <i class="fa-solid fa-border-all text-indigo-300"></i>
          <span id="current-bg-name" class="hidden sm:inline">Blank Canvas</span>
          <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
        </button>
        <div class="absolute right-0 mt-1 w-36 bg-slate-800 border border-slate-700 rounded shadow-xl hidden group-hover:block z-50">
          <button onclick="setCanvasBackground('blank')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-indigo-600 flex items-center space-x-2">
            <i class="fa-regular fa-square"></i><span>Blank Canvas</span>
          </button>
          <button onclick="setCanvasBackground('grid')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-indigo-600 flex items-center space-x-2">
            <i class="fa-solid fa-table-cells"></i><span>Grid Paper</span>
          </button>
          <button onclick="setCanvasBackground('dots')" class="w-full text-left px-3 py-1.5 text-xs text-slate-200 hover:bg-indigo-600 flex items-center space-x-2">
            <i class="fa-solid fa-ellipsis-vertical"></i><span>Dot Grid</span>
          </button>
        </div>
      </div>

      <!-- Toggle Timer Widget Button -->
      <button id="toggle-timer-btn" class="bg-slate-800 hover:bg-slate-700 text-amber-300 px-2.5 py-1 rounded text-xs flex items-center space-x-1 border border-slate-700">
        <i class="fa-solid fa-stopwatch"></i>
        <span class="hidden sm:inline">Timer</span>
      </button>

      <!-- Toggle Calculator Button -->
      <button id="toggle-calc-btn" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 px-2.5 py-1 rounded text-xs flex items-center space-x-1 border border-slate-700">
        <i class="fa-solid fa-calculator"></i>
        <span class="hidden sm:inline">Calculator</span>
      </button>

      <!-- Export Options -->
      <div class="relative group">
        <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded text-xs flex items-center space-x-1 font-medium shadow">
          <i class="fa-solid fa-download"></i>
          <span>Export</span>
          <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
        </button>
        <div class="absolute right-0 mt-1 w-32 bg-slate-800 border border-slate-700 rounded shadow-xl hidden group-hover:block z-50">
          <button onclick="exportCanvas('png')" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-indigo-600 flex items-center space-x-2">
            <i class="fa-regular fa-file-image text-green-400"></i><span>Image (PNG)</span>
          </button>
          <button onclick="exportCanvas('pdf')" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-indigo-600 flex items-center space-x-2">
            <i class="fa-regular fa-file-pdf text-red-400"></i><span>PDF Document</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= MAIN WORKSPACE CANVAS AREA ================= -->
  <main class="flex-1 relative overflow-hidden bg-white" id="canvas-container">
    
    <!-- Whiteboard Drawing Canvas -->
    <canvas id="whiteboard" class="absolute inset-0 bg-blank z-0 cursor-crosshair"></canvas>

    <!-- Visual Cursor Indicator for Eraser -->
    <div id="eraser-cursor" class="pointer-events-none absolute hidden rounded-full border border-slate-700 bg-red-400/20 z-10 -translate-x-1/2 -translate-y-1/2 shadow-sm"></div>

    <!-- SLIM SINGLE-COLUMN LEFT TOOLBAR -->
    <aside id="left-sidebar" class="absolute left-2 top-2 z-20 flex flex-col bg-slate-900/95 backdrop-blur-md text-white rounded-lg shadow-2xl border border-slate-700/80 p-1.5 space-y-2 transition-all duration-300 w-12 items-center">
      
      <!-- DRAWING TOOLS SECTION -->
      <div class="flex flex-col space-y-1.5 w-full items-center">
        <!-- Pen Tool -->
        <button id="tool-pen" onclick="setTool('pen')" class="w-9 h-9 rounded-md flex items-center justify-center bg-indigo-600 text-white hover:bg-indigo-500 transition shadow" data-tooltip="Pen">
          <i class="fa-solid fa-pen"></i>
        </button>

        <!-- Highlighter Tool -->
        <button id="tool-highlighter" onclick="setTool('highlighter')" class="w-9 h-9 rounded-md flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition" data-tooltip="Highlighter">
          <i class="fa-solid fa-highlighter"></i>
        </button>

        <!-- Eraser Tool -->
        <button id="tool-eraser" onclick="setTool('eraser')" class="w-9 h-9 rounded-md flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition" data-tooltip="Eraser">
          <i class="fa-solid fa-eraser"></i>
        </button>
      </div>

      <div class="w-full border-t border-slate-700/80 my-1"></div>

      <!-- COLORS PALETTE -->
      <div id="color-palette" class="flex flex-col space-y-1.5 w-full items-center">
        <!-- Black / Default Dark -->
        <button onclick="setColor('#1e293b')" class="color-btn w-6 h-6 rounded-full bg-slate-800 border-2 border-gray-400 shadow hover:scale-110 transition" data-color="#1e293b"></button>
        <!-- Blue -->
        <button onclick="setColor('#2563eb')" class="color-btn w-6 h-6 rounded-full bg-blue-600 border-2 border-gray-400 shadow hover:scale-110 transition" data-color="#2563eb"></button>
        <!-- Red -->
        <button onclick="setColor('#dc2626')" class="color-btn w-6 h-6 rounded-full bg-red-600 border-2 border-gray-400 shadow hover:scale-110 transition" data-color="#dc2626"></button>
        <!-- Green -->
        <button onclick="setColor('#16a34a')" class="color-btn w-6 h-6 rounded-full bg-green-600 border-2 border-gray-400 shadow hover:scale-110 transition" data-color="#16a34a"></button>
        
        <!-- Highlighter Quick Colors (Updated to lower opacity ~0.15) -->
        <div id="highlighter-colors" class="hidden flex-col space-y-1.5 pt-1">
          <button onclick="setColor('rgba(250, 204, 21, 0.15)')" class="color-btn w-6 h-6 rounded-full bg-yellow-400 border-2 border-gray-400 shadow hover:scale-110 transition" data-color="rgba(250, 204, 21, 0.15)"></button>
          <button onclick="setColor('rgba(74, 222, 128, 0.15)')" class="color-btn w-6 h-6 rounded-full bg-green-400 border-2 border-gray-400 shadow hover:scale-110 transition" data-color="rgba(74, 222, 128, 0.15)"></button>
          <button onclick="setColor('rgba(56, 189, 248, 0.15)')" class="color-btn w-6 h-6 rounded-full bg-cyan-400 border-2 border-gray-400 shadow hover:scale-110 transition" data-color="rgba(56, 189, 248, 0.15)"></button>
          <button onclick="setColor('rgba(244, 114, 182, 0.15)')" class="color-btn w-6 h-6 rounded-full bg-pink-400 border-2 border-gray-400 shadow hover:scale-110 transition" data-color="rgba(244, 114, 182, 0.15)"></button>
        </div>
      </div>

      <div class="w-full border-t border-slate-700/80 my-1"></div>

      <!-- TOOL SIZE CONTROLLER (PIXEL ADJUSTABLE & TOOL INDEPENDENT) -->
      <div class="flex flex-col items-center space-y-1 w-full">
        <span class="text-[10px] font-mono text-slate-400 uppercase tracking-tighter">Size</span>
        <div class="relative group flex flex-col items-center">
          <input type="number" id="stroke-px-input" min="1" max="100" value="3" onchange="setToolSize(this.value)" class="w-9 bg-slate-800 border border-slate-700 text-white text-xs font-mono font-bold rounded py-0.5 text-center focus:outline-none focus:border-indigo-500">
          <span id="px-unit" class="text-[9px] text-slate-400 mt-0.5">px</span>

          <!-- Popup slider widget on hover/focus (Only slider) -->
          <div class="absolute left-11 top-1/2 -translate-y-1/2 hidden group-hover:flex group-focus-within:flex bg-slate-800 border border-slate-700 p-2 rounded-lg shadow-xl z-50 items-center w-28">
            <input type="range" id="stroke-px-slider" min="1" max="100" value="3" oninput="setToolSize(this.value)" class="w-full accent-indigo-500 cursor-pointer h-1.5 bg-slate-700 rounded-lg">
          </div>
        </div>
      </div>

      <div class="w-full border-t border-slate-700/80 my-1"></div>

      <!-- UNDO / REDO / CLEAR -->
      <div class="flex flex-col space-y-1.5 w-full items-center">
        <button onclick="undo()" class="w-9 h-9 rounded-md flex items-center justify-center text-slate-300 hover:bg-slate-800 hover:text-white transition" data-tooltip="Undo">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button onclick="redo()" class="w-9 h-9 rounded-md flex items-center justify-center text-slate-300 hover:bg-slate-800 hover:text-white transition" data-tooltip="Redo">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <!-- Trash Can Clears Entire Screen -->
        <button onclick="clearCanvas()" class="w-9 h-9 rounded-md flex items-center justify-center text-red-400 hover:bg-red-500 hover:text-white transition" data-tooltip="Clear Board">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>

    </aside>

    <!-- Floating Re-open Tools Button (When Sidebar Hidden) -->
    <button id="show-sidebar-tab" onclick="toggleSidebar()" class="hidden absolute left-0 top-6 z-20 bg-slate-900 text-white px-2 py-2.5 rounded-r-lg shadow-lg border border-l-0 border-slate-700 hover:bg-indigo-600 transition flex items-center space-x-1">
      <i class="fa-solid fa-screwdriver-wrench text-xs"></i>
      <span class="text-xs font-semibold pr-1">Tools</span>
    </button>


    <!-- ================= FLOATING COUNTDOWN TIMER WIDGET ================= -->
    <div id="timer-widget" class="floating-window absolute top-4 right-4 z-20 bg-slate-900/95 backdrop-blur-md text-white rounded-xl shadow-2xl border border-slate-700/80 w-72 hidden overflow-hidden transition-all">
      <!-- Title / Header Bar (Draggable) -->
      <div id="timer-header" class="bg-slate-800/90 px-3 py-2 flex items-center justify-between cursor-move border-b border-slate-700/60">
        <div class="flex items-center space-x-2 text-amber-400 font-semibold text-xs tracking-wider uppercase">
          <i class="fa-solid fa-stopwatch"></i>
          <span>Countdown Timer</span>
        </div>
        <div class="flex items-center space-x-1">
          <button onclick="testMarimbaSound()" class="text-slate-400 hover:text-amber-300 text-xs px-1.5 py-0.5 rounded hover:bg-slate-700 transition" title="Test Marimba Sound">
            <i class="fa-solid fa-volume-high"></i>
          </button>
          <button onclick="toggleTimerWidget()" class="text-slate-400 hover:text-white text-xs px-1.5 py-0.5 rounded hover:bg-slate-700 transition">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Main Display -->
      <div class="p-3.5 flex flex-col items-center">
        <!-- Big Digits Display -->
        <div id="timer-display" class="text-4xl font-black font-mono tracking-wider text-amber-400 my-1 drop-shadow">
          05:00
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden my-2 border border-slate-700">
          <div id="timer-progress" class="bg-amber-400 h-full w-full transition-all duration-300"></div>
        </div>

        <!-- Quick Preset Buttons (30s, 1m, 2m, 5m, 10m) -->
        <div class="grid grid-cols-5 gap-1 w-full my-2">
          <button onclick="setTimerPreset(0.5)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1 rounded font-medium border border-slate-700">30s</button>
          <button onclick="setTimerPreset(1)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1 rounded font-medium border border-slate-700">1m</button>
          <button onclick="setTimerPreset(2)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1 rounded font-medium border border-slate-700">2m</button>
          <button onclick="setTimerPreset(5)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1 rounded font-medium border border-slate-700">5m</button>
          <button onclick="setTimerPreset(10)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1 rounded font-medium border border-slate-700">10m</button>
        </div>

        <!-- Manual Custom Input -->
        <div class="flex items-center space-x-2 my-1 w-full text-xs">
          <span class="text-slate-400">Custom:</span>
          <input type="number" id="custom-minutes" min="1" max="180" placeholder="Min" class="bg-slate-800 text-white border border-slate-700 rounded px-2 py-1 w-16 text-center focus:outline-none focus:border-amber-400">
          <button onclick="setCustomTimer()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-1 rounded border border-slate-600">Set</button>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center space-x-2 w-full mt-2 pt-2 border-t border-slate-800">
          <button id="timer-start-btn" onclick="toggleTimer()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 rounded flex items-center justify-center space-x-1.5 shadow transition">
            <i class="fa-solid fa-play text-xs"></i>
            <span id="start-btn-text">Start</span>
          </button>
          <button onclick="resetTimer()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-3 py-1.5 rounded border border-slate-700 transition">
            <i class="fa-solid fa-rotate-left text-xs"></i>

        </div>
      </div>
    </div>


    <!-- ================= FLOATING DESMOS CALCULATOR POP-OUT WINDOW ================= -->
    <div id="calc-popout" class="floating-window absolute top-12 left-20 z-20 bg-slate-900 text-white rounded-xl shadow-2xl border border-slate-700/80 w-[420px] h-[520px] hidden flex-col overflow-hidden transition-all">
      <!-- Title Header Bar (Draggable) -->
      <div id="calc-header" class="bg-slate-800 px-3 py-2 flex items-center justify-between cursor-move border-b border-slate-700">
        <div class="flex items-center space-x-2 text-indigo-400 font-semibold text-xs tracking-wider uppercase">
          <i class="fa-solid fa-calculator"></i>
          <span>Desmos Scientific Calculator</span>
        </div>
        <div class="flex items-center space-x-1.5">
          <button onclick="minimizeCalc()" class="text-slate-400 hover:text-white px-1.5 py-0.5 rounded hover:bg-slate-700 text-xs">
            <i class="fa-solid fa-minus"></i>
          </button>
          <button onclick="maximizeCalc()" class="text-slate-400 hover:text-white px-1.5 py-0.5 rounded hover:bg-slate-700 text-xs">
            <i class="fa-solid fa-expand"></i>
          </button>
          <button onclick="toggleCalcPopout()" class="text-slate-400 hover:text-red-400 px-1.5 py-0.5 rounded hover:bg-slate-700 text-xs">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Desmos Calculator Element -->
      <div class="flex-1 bg-white relative w-full h-full">
        <div id="desmos-calculator-target" class="w-full h-full"></div>
      </div>
    </div>

    <!-- ================= TIME IS UP SOUND & VISUAL ALARM BANNER ================= -->
    <div id="alarm-banner" class="hidden absolute inset-x-0 top-16 z-50 mx-auto w-11/12 max-w-lg bg-red-600 text-white p-4 rounded-xl shadow-2xl border-2 border-red-400 alarm-active flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-bell text-3xl animate-bounce text-yellow-300"></i>
        <div>
          <h3 class="font-extrabold text-lg uppercase tracking-wider">Time is Up!</h3>
          <p class="text-xs text-red-100">Great job on your math work!</p>
        </div>
      </div>
      <button onclick="stopAlarmSound()" class="bg-white text-red-700 hover:bg-red-100 font-bold px-4 py-2 rounded-lg text-sm shadow transition">
        Stop Sound
      </button>
    </div>

  </main>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    /* ================= 1. INITIALIZATION & STATE ================= */
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    const canvasContainer = document.getElementById('canvas-container');
    const eraserCursor = document.getElementById('eraser-cursor');

    let isDrawing = false;
    let currentTool = 'pen'; // 'pen', 'highlighter', 'eraser'
    let strokeColor = '#1e293b';
    let highlighterColor = 'rgba(250, 204, 21, 0.15)';
    let currentBackground = 'blank'; // Default to blank canvas

    // Independent tool sizes saved in pixels
    const toolSizes = {
      pen: 3,
      highlighter: 16,
      eraser: 24
    };

    // Drawing History Stack for Undo/Redo
    let historyStack = [];
    let historyStep = -1;
    const MAX_HISTORY = 25;

    /* ================= 2. CANVAS RESIZING & BACKGROUNDS ================= */
    function resizeCanvas() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      if (canvas.width > 0 && canvas.height > 0) {
        tempCtx.drawImage(canvas, 0, 0);
      }

      canvas.width = canvasContainer.clientWidth;
      canvas.height = canvasContainer.clientHeight;

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (tempCanvas.width > 0 && tempCanvas.height > 0) {
        ctx.drawImage(tempCanvas, 0, 0);
      } else {
        saveState();
      }
    }

    function setCanvasBackground(bgType) {
      currentBackground = bgType;
      canvas.className = 'absolute inset-0 z-0 cursor-crosshair ';
      
      const bgNameEl = document.getElementById('current-bg-name');
      if (bgType === 'grid') {
        canvas.classList.add('bg-grid');
        if(bgNameEl) bgNameEl.innerText = 'Grid Paper';
      } else if (bgType === 'dots') {
        canvas.classList.add('bg-dots');
        if(bgNameEl) bgNameEl.innerText = 'Dot Grid';
      } else {
        canvas.classList.add('bg-blank');
        if(bgNameEl) bgNameEl.innerText = 'Blank Canvas';
      }
    }

    /* ================= 3. WHITEBOARD DRAWING ENGINE ================= */
    function getCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      let x, y;
      if (e.touches && e.touches.length > 0) {
        x = e.touches[0].clientX - rect.left;
        y = e.touches[0].clientY - rect.top;
      } else {
        x = e.clientX - rect.left;
        y = e.clientY - rect.top;
      }
      return { x, y };
    }

    function startDrawing(e) {
      initAudioUnlock();
      isDrawing = true;
      const pos = getCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      setupContextTool();
    }

    function setupContextTool() {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = toolSizes.eraser;
      } else if (currentTool === 'highlighter') {
        ctx.globalCompositeOperation = 'multiply';
        ctx.strokeStyle = highlighterColor;
        ctx.lineWidth = toolSizes.highlighter;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = toolSizes.pen;
      }
    }

    function draw(e) {
      updateEraserCursorPosition(e);
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getCoordinates(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function updateEraserCursorPosition(e) {
      if (!eraserCursor) return;
      if (currentTool === 'eraser') {
        const pos = getCoordinates(e);
        const size = toolSizes.eraser;
        eraserCursor.style.width = `${size}px`;
        eraserCursor.style.height = `${size}px`;
        eraserCursor.style.left = `${pos.x}px`;
        eraserCursor.style.top = `${pos.y}px`;
        eraserCursor.classList.remove('hidden');
      } else {
        eraserCursor.classList.add('hidden');
      }
    }

    function hideEraserCursor() {
      if (eraserCursor) eraserCursor.classList.add('hidden');
    }

    function stopDrawing() {
      if (isDrawing) {
        ctx.closePath();
        isDrawing = false;
        saveState();
      }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', (e) => {
      stopDrawing();
      hideEraserCursor();
    });

    canvas.addEventListener('touchstart', (e) => {
      startDrawing(e);
      updateEraserCursorPosition(e);
    }, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', (e) => {
      stopDrawing();
      hideEraserCursor();
    });

    /* ================= 4. TOOLBAR & PALETTE SELECTION ================= */
    function setTool(tool) {
      currentTool = tool;

      document.getElementById('tool-pen').className = `w-9 h-9 rounded-md flex items-center justify-center transition ${tool === 'pen' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`;
      document.getElementById('tool-highlighter').className = `w-9 h-9 rounded-md flex items-center justify-center transition ${tool === 'highlighter' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`;
      document.getElementById('tool-eraser').className = `w-9 h-9 rounded-md flex items-center justify-center transition ${tool === 'eraser' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`;

      if (tool !== 'eraser') {
        hideEraserCursor();
      }

      const hlColors = document.getElementById('highlighter-colors');
      if (tool === 'highlighter') {
        hlColors.classList.remove('hidden');
        hlColors.classList.add('flex');
      } else {
        hlColors.classList.add('hidden');
        hlColors.classList.remove('flex');
      }

      // Update size controls to match the selected tool's saved independent size
      updateSizeControlsUI();
    }

    function setColor(color) {
      if (currentTool === 'highlighter') {
        highlighterColor = color;
      } else {
        strokeColor = color;
        if (currentTool === 'eraser') setTool('pen');
      }

      document.querySelectorAll('.color-btn').forEach(btn => {
        if (btn.getAttribute('data-color') === color) {
          btn.classList.add('border-white', 'scale-110');
          btn.classList.remove('border-gray-400');
        } else {
          btn.classList.remove('border-white', 'scale-110');
          btn.classList.add('border-gray-400');
        }
      });
    }

    function setToolSize(val) {
      let size = parseInt(val);
      if (isNaN(size)) return;
      size = Math.min(Math.max(size, 1), 100);

      toolSizes[currentTool] = size;
      updateSizeControlsUI();
    }

    function updateSizeControlsUI() {
      const activeSize = toolSizes[currentTool];
      const input = document.getElementById('stroke-px-input');
      const slider = document.getElementById('stroke-px-slider');

      if (input) input.value = activeSize;
      if (slider) slider.value = activeSize;
    }

    /* ================= 5. HISTORY (UNDO / REDO / CLEAR) ================= */
    function saveState() {
      if (historyStep < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyStep + 1);
      }
      historyStack.push(canvas.toDataURL());
      if (historyStack.length > MAX_HISTORY) {
        historyStack.shift();
      } else {
        historyStep++;
      }
    }

    function undo() {
      if (historyStep > 0) {
        historyStep--;
        restoreState(historyStack[historyStep]);
      } else if (historyStep === 0) {
        historyStep = -1;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function redo() {
      if (historyStep < historyStack.length - 1) {
        historyStep++;
        restoreState(historyStack[historyStep]);
      }
    }

    function restoreState(dataUrl) {
      const img = new Image();
      img.src = dataUrl;
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(img, 0, 0);
      };
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      saveState();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('left-sidebar');
      const showTab = document.getElementById('show-sidebar-tab');
      const toggleText = document.getElementById('toggle-sidebar-text');

      if (sidebar.classList.contains('hidden')) {
        sidebar.classList.remove('hidden');
        showTab.classList.add('hidden');
        if(toggleText) toggleText.innerText = 'Hide Tools';
      } else {
        sidebar.classList.add('hidden');
        showTab.classList.remove('hidden');
        if(toggleText) toggleText.innerText = 'Show Tools';
      }
    }

    /* ================= 6. LIVE DIGITAL CLOCK ================= */
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;

      document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;

      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('live-date').innerText = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ================= 7. WEB AUDIO SYNTHESIZED MARIMBA CHIME ================= */
    let audioCtx = null;
    let alarmInterval = null;

    function initAudioUnlock() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playMarimbaNote(freq, time, duration = 0.8) {
      if (!audioCtx) initAudioUnlock();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, time);

      gain.gain.setValueAtTime(0.8, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(time);
      osc.stop(time + duration);
    }

    function playMarimbaMelody() {
      initAudioUnlock();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      playMarimbaNote(523.25, now + 0.0, 0.6); // C5
      playMarimbaNote(659.25, now + 0.15, 0.6); // E5
      playMarimbaNote(783.99, now + 0.30, 0.6); // G5
      playMarimbaNote(1046.50, now + 0.45, 1.2); // C6
    }

    function testMarimbaSound() {
      playMarimbaMelody();
    }

    function triggerAlarm() {
      playMarimbaMelody();
      alarmInterval = setInterval(() => {
        playMarimbaMelody();
      }, 2500);

      document.getElementById('alarm-banner').classList.remove('hidden');
    }

    function stopAlarmSound() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
      document.getElementById('alarm-banner').classList.add('hidden');
    }

    /* ================= 8. COUNTDOWN TIMER ENGINE ================= */
    let timerTotalSeconds = 300; // Default 5 mins
    let timerRemainingSeconds = 300;
    let timerInterval = null;
    let isTimerRunning = false;

    function updateTimerDisplay() {
      const mins = Math.floor(timerRemainingSeconds / 60);
      const secs = timerRemainingSeconds % 60;
      document.getElementById('timer-display').innerText = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const percent = (timerRemainingSeconds / timerTotalSeconds) * 100;
      document.getElementById('timer-progress').style.width = `${Math.max(0, percent)}%`;
    }

    function setTimerPreset(minutes) {
      resetTimer();
      timerTotalSeconds = Math.round(minutes * 60);
      timerRemainingSeconds = timerTotalSeconds;
      updateTimerDisplay();
    }

    function setCustomTimer() {
      const input = document.getElementById('custom-minutes');
      const val = parseInt(input.value);
      if (val && val > 0) {
        setTimerPreset(val);
        input.value = '';
      }
    }

    function toggleTimer() {
      initAudioUnlock();
      if (isTimerRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (timerRemainingSeconds <= 0) return;
      isTimerRunning = true;
      document.getElementById('start-btn-text').innerText = 'Pause';
      document.getElementById('timer-start-btn').className = 'flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 rounded flex items-center justify-center space-x-1.5 shadow transition';

      timerInterval = setInterval(() => {
        if (timerRemainingSeconds > 0) {
          timerRemainingSeconds--;
          updateTimerDisplay();
        } else {
          pauseTimer();
          triggerAlarm();
        }
      }, 1000);
    }

    function pauseTimer() {
      isTimerRunning = false;
      clearInterval(timerInterval);
      document.getElementById('start-btn-text').innerText = 'Start';
      document.getElementById('timer-start-btn').className = 'flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 rounded flex items-center justify-center space-x-1.5 shadow transition';
    }

    function resetTimer() {
      pauseTimer();
      stopAlarmSound();
      timerRemainingSeconds = timerTotalSeconds;
      updateTimerDisplay();
    }

    function toggleTimerWidget() {
      const timerWidget = document.getElementById('timer-widget');
      timerWidget.classList.toggle('hidden');
    }

    document.getElementById('toggle-timer-btn').addEventListener('click', toggleTimerWidget);

    /* ================= 9. DESMOS CALCULATOR POP-OUT ENGINE ================= */
    let desmosCalculator = null;
    let isCalcMaximized = false;

    function initDesmosCalculator() {
      const elt = document.getElementById('desmos-calculator-target');
      if (!elt) return;

      if (typeof Desmos !== 'undefined' && Desmos.ScientificCalculator) {
        if (!desmosCalculator) {
          desmosCalculator = Desmos.ScientificCalculator(elt, {
            border: false,
            expressions: true
          });
        }
      } else {
        // Fallback embed if Desmos script failed or hasn't loaded yet
        elt.innerHTML = `<iframe src="https://www.desmos.com/scientific" class="w-full h-full border-0"></iframe>`;
      }
    }

    function toggleCalcPopout() {
      const popout = document.getElementById('calc-popout');
      if (popout.classList.contains('hidden')) {
        popout.classList.remove('hidden');
        popout.classList.add('flex');
        initDesmosCalculator();
      } else {
        popout.classList.add('hidden');
        popout.classList.remove('flex');
      }
    }

    function minimizeCalc() {
      const popout = document.getElementById('calc-popout');
      popout.style.height = '42px';
    }

    function maximizeCalc() {
      const popout = document.getElementById('calc-popout');
      if (isCalcMaximized) {
        popout.style.width = '420px';
        popout.style.height = '520px';
        popout.style.top = '50px';
        popout.style.left = '80px';
        isCalcMaximized = false;
      } else {
        popout.style.width = '95vw';
        popout.style.height = '85vh';
        popout.style.top = '60px';
        popout.style.left = '2.5vw';
        isCalcMaximized = true;
      }
      if (desmosCalculator) desmosCalculator.resize();
    }

    document.getElementById('toggle-calc-btn').addEventListener('click', toggleCalcPopout);

    /* ================= 10. DRAGGABLE WINDOW ENGINE ================= */
    function makeDraggable(windowEl, headerEl) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

      headerEl.onmousedown = dragMouseDown;
      headerEl.ontouchstart = dragTouchStart;

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        windowEl.style.top = (windowEl.offsetTop - pos2) + "px";
        windowEl.style.left = (windowEl.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }

      function dragTouchStart(e) {
        if (e.touches.length === 1) {
          pos3 = e.touches[0].clientX;
          pos4 = e.touches[0].clientY;
          document.ontouchend = closeTouchDrag;
          document.ontouchmove = touchDrag;
        }
      }

      function touchDrag(e) {
        if (e.touches.length === 1) {
          pos1 = pos3 - e.touches[0].clientX;
          pos2 = pos4 - e.touches[0].clientY;
          pos3 = e.touches[0].clientX;
          pos4 = e.touches[0].clientY;
          windowEl.style.top = (windowEl.offsetTop - pos2) + "px";
          windowEl.style.left = (windowEl.offsetLeft - pos1) + "px";
        }
      }

      function closeTouchDrag() {
        document.ontouchend = null;
        document.ontouchmove = null;
      }
    }

    makeDraggable(document.getElementById('timer-widget'), document.getElementById('timer-header'));
    makeDraggable(document.getElementById('calc-popout'), document.getElementById('calc-header'));

    /* ================= 11. EXPORT TO PNG & PDF ================= */
    function getExportCanvas() {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const expCtx = exportCanvas.getContext('2d');

      expCtx.fillStyle = '#ffffff';
      expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      if (currentBackground === 'grid') {
        expCtx.strokeStyle = 'rgba(200, 210, 225, 0.6)';
        expCtx.lineWidth = 1;
        for (let x = 0; x < exportCanvas.width; x += 30) {
          expCtx.beginPath();
          expCtx.moveTo(x, 0);
          expCtx.lineTo(x, exportCanvas.height);
          expCtx.stroke();
        }
        for (let y = 0; y < exportCanvas.height; y += 30) {
          expCtx.beginPath();
          expCtx.moveTo(0, y);
          expCtx.lineTo(exportCanvas.width, y);
          expCtx.stroke();
        }
      } else if (currentBackground === 'dots') {
        expCtx.fillStyle = 'rgba(150, 160, 180, 0.5)';
        for (let x = 12; x < exportCanvas.width; x += 25) {
          for (let y = 12; y < exportCanvas.height; y += 25) {
            expCtx.beginPath();
            expCtx.arc(x, y, 1.5, 0, Math.PI * 2);
            expCtx.fill();
          }
        }
      }

      expCtx.drawImage(canvas, 0, 0);
      return exportCanvas;
    }

    function getDateFilenameString() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `Mr_Vilags_Workspace_${yyyy}-${mm}-${dd}`;
    }

    function exportCanvas(type) {
      const expCanvas = getExportCanvas();
      const filename = getDateFilenameString();

      if (type === 'png') {
        const link = document.createElement('a');
        link.download = `${filename}.png`;
        link.href = expCanvas.toDataURL('image/png');
        link.click();
      } else if (type === 'pdf') {
        const { jsPDF } = window.jspdf;
        const orientation = expCanvas.width > expCanvas.height ? 'landscape' : 'portrait';
        const pdf = new jsPDF(orientation, 'px', [expCanvas.width, expCanvas.height]);
        const imgData = expCanvas.toDataURL('image/png');
        pdf.addImage(imgData, 'PNG', 0, 0, expCanvas.width, expCanvas.height);
        pdf.save(`${filename}.pdf`);
      }
    }

    /* ================= 12. INITIALIZATION ON LOAD ================= */
    window.addEventListener('load', () => {
      setCanvasBackground('blank');
      resizeCanvas();
      setTool('pen');
      setColor('#1e293b');
      updateSizeControlsUI();
      updateTimerDisplay();
      
      document.getElementById('toggle-sidebar-btn').addEventListener('click', toggleSidebar);
    });

    window.addEventListener('resize', resizeCanvas);
  </script>
